<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#0b8fd9" />
  <title>Моя Ферма v11</title>
  <link rel="preload" as="image" href="./assets/home.jpg">
  <link rel="stylesheet" href="./styles.css?v=11" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <main id="app">
    <section id="game" class="game" aria-label="Моя ферма">
      <img id="screenArt" class="screen-art" src="./assets/home.jpg" alt="Моя ферма" draggable="false"
           onerror="this.onerror=null;this.src='./assets/fallback.svg';" />
      <div id="bootFallback" class="boot-fallback">
        <div class="boot-icon">🏡</div>
        <div class="boot-title">МОЯ ФЕРМА</div>
        <div class="boot-sub">Игра загружается...</div>
      </div>
      <div id="hudLayer" class="hud-layer"></div>
      <div id="hitLayer" class="hit-layer"></div>
      <div id="toast" class="toast"></div>

      <div id="modalOverlay" class="modal-overlay" hidden>
        <article class="modal">
          <button id="modalClose" class="modal-close">×</button>
          <h2 id="modalTitle">Окно</h2>
          <div id="modalBody" class="modal-body"></div>
        </article>
      </div>

      <noscript>
        <div class="noscript">JavaScript выключен. Игра не может запуститься.</div>
      </noscript>
    </section>
  </main>
  <script src="./app.js?v=11"></script>
</body>
</html>
