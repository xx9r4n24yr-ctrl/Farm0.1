<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#0b8fd9" />
  <title>Моя Ферма</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <main id="app">
    <section id="game" class="game">
      <img id="screenArt" class="screen-art" src="assets/home.jpg" alt="Моя ферма" draggable="false"
           onerror="this.onerror=null;this.src='assets/fallback.svg';" />
      <div id="hudLayer" class="hud-layer"></div>
      <div id="hitLayer" class="hit-layer"></div>
      <div id="toast" class="toast"></div>
      <div id="modalOverlay" class="modal-overlay" hidden>
        <article class="modal">
          <button id="modalClose" class="modal-close">×</button>
          <h2 id="modalTitle">Окно</h2>
          <div id="modalBody" class="modal-body"></div>
        </article>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
